services:
  - type: web
    name: verireview-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # $PORT is injected by Render; bind 0.0.0.0 (not 127.0.0.1).
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: verireview-db
          property: connectionString

databases:
  - name: verireview-db
    databaseName: verireview
    user: verireview
